# nginx vhost for the NLern membership site.
# Proxies to the FastAPI container bound to 127.0.0.1:8090 (not public).
# certbot --nginx adds the TLS (443) server block and HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name nlern.techsolutionsutrecht.nl;

    # Keep request bodies small (this site only handles tiny form posts).
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
