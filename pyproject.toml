[project]
name = "dutch-learning-bot"
version = "0.1.0"
description = "Telegram bot for Persian speakers learning Dutch (CEFR A1-B2)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiogram>=3.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "fsrs>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4.0",
    "asyncpg>=0.31.0",
    "playwright>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Membership website (Mollie iDEAL checkout + webhook). Deployed separately
# from the bot but shares this repo's database layer and services.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "handlers", "services", "database", "keyboards", "middlewares", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# اجازه‌ی نصب با هر یک از نسخه‌های پایتون سازگار
